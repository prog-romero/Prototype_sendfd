provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

functions:
  timing-fn-a:
    image: romerosdd/timing-fn-a-ka-https:latest
    fprocess: /usr/local/bin/timing-fn-ka-worker
    environment:
      mode: http
      http_upstream_url: "http://127.0.0.1:8085"
      HTTPMIGRATE_ENABLE: "1"
      SENDFD_ENABLE: "1"
      SENDFD_SOCKET_DIR: "/run/tlsmigrate"
      sendfd_enable: "1"
      sendfd_socket_dir: "/run/tlsmigrate"
      HTTPMIGRATE_KA_FUNCTION_NAME: "timing-fn-a"
      HTTPS_TLS_CERT: "/var/openfaas/secrets/server-crt"
      HTTPS_TLS_KEY: "/var/openfaas/secrets/server-key"
    secrets:
      - server-crt
      - server-key
      
