provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

# Approach 3 (full-proxy): same image as fn-a, configured for product (fn-b).
functions:
  sumprod-timing-fn-b:
    image: romerosdd/sumprod-fullproxy:latest
    fprocess: /usr/local/bin/business-fn
    environment:
      mode: http
      http_upstream_url: "http://127.0.0.1:8085"
      HTTPMIGRATE_ENABLE: "1"
      SENDFD_ENABLE: "1"
      sendfd_enable: "1"
      SENDFD_FULL_PROXY: "1"
      sendfd_full_proxy: "1"
      SENDFD_SOCKET_DIR: "/run/tlsmigrate"
      sendfd_socket_dir: "/run/tlsmigrate"
      HTTPMIGRATE_KA_FUNCTION_NAME: "sumprod-timing-fn-b"
      # Business binary: product (name contains "-b").
      VANILLA_FN_NAME: "prod-b"
      VANILLA_FN_PORT: "8085"
      HTTPS_TLS_CERT: "/var/openfaas/secrets/server-crt"
      HTTPS_TLS_KEY: "/var/openfaas/secrets/server-key"
    secrets:
      - server-crt
      - server-key
