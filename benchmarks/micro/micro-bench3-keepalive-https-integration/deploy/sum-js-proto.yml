provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

# sum en JS (Node/Express), mode PROTOTYPE (full-proxy) : le watchdog fait toute
# la plomberie TLS/sendfd et reverse-proxy la requête migrée vers le serveur node.
functions:
  sum-js-proto:
    image: romerosdd/sum-js-fullproxy:latest
    fprocess: node server.js
    environment:
      mode: http
      http_upstream_url: "http://127.0.0.1:8085"
      http_port: "8085"
      HTTPMIGRATE_ENABLE: "1"
      SENDFD_ENABLE: "1"
      sendfd_enable: "1"
      SENDFD_FULL_PROXY: "1"
      sendfd_full_proxy: "1"
      SENDFD_SOCKET_DIR: "/run/tlsmigrate"
      sendfd_socket_dir: "/run/tlsmigrate"
      HTTPMIGRATE_KA_FUNCTION_NAME: "sum-js-proto"
      HTTPS_TLS_CERT: "/var/openfaas/secrets/server-crt"
      HTTPS_TLS_KEY: "/var/openfaas/secrets/server-key"
    secrets:
      - server-crt
      - server-key
