      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      REDIS_ENDPOINT: "redis://10.62.0.1:6379"

  trafficstatistics:
    image: romerosdd/iot-vanilla-trafficstatistics:latest
    fprocess: node index.js
    environment:
      mode: http
      http_upstream_url: "http://127.0.0.1:8085"
      http_port: "8085"
      sendfd_enable: "0"
      IS_OPENFAAS: "1"
      BEFAAS_FN_NAME: "trafficstatistics"
      OPENFAAS_ENDPOINT: "http://192.168.2.2:8080/function"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      REDIS_ENDPOINT: "redis://10.62.0.1:6379"

  setlightphasecalculation:
    image: romerosdd/iot-vanilla-setlightphasecalculation:latest
    fprocess: node index.js
